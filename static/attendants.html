<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#73B63A">
  <title>Atendentes · Banho & Tosa</title>
  <link rel="icon" href="/static/logo-256.png">
  <link rel="apple-touch-icon" href="/static/logo-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img src="/static/logo-256.png" alt="Cão & Cia" class="logo">
        <div class="brand-text">
          <span class="brand-name">Cão &amp; Cia</span>
          <h1 class="page-title">Atendentes</h1>
        </div>
      </a>
      <div class="topbar-actions">
        <nav class="topnav" id="topnav" aria-label="Navegação"></nav>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="section-head" style="margin-top:0">
      <div class="sec-icon teal" data-icon="users"></div>
      <h2>Equipe</h2>
      <span class="count" id="n-att">0</span>
      <button class="btn btn-primary btn-sm" id="add-att" data-icon="plus" style="margin-left:auto">Adicionar</button>
    </div>
    <div class="panel-sub" style="margin:-4px 0 12px">Cada atendente usa o próprio PIN para pegar e finalizar atendimentos.</div>

    <div class="table-wrap">
      <table class="att-table">
        <thead>
          <tr>
            <th>Atendente</th>
            <th>Desde</th>
            <th>Status</th>
            <th class="num">Total</th>
            <th class="num">Este mês</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/ui.js"></script>
  <script src="/static/admin.js"></script>
  <script src="/static/attendants.js"></script>
</body>
</html>
