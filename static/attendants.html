<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#73B63A">
  <title>Atendentes · Banho & Tosa</title>
  <link rel="icon" href="/static/logo-256.png">
  <link rel="apple-touch-icon" href="/static/logo-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img src="/static/logo-256.png" alt="Cão & Cia" class="logo">
        <div class="brand-text">
          <span class="brand-name">Cão &amp; Cia</span>
          <h1 class="page-title">Atendentes</h1>
        </div>
      </a>
      <div class="topbar-actions">
        <button id="logout" class="btn btn-ghost btn-icon admin-only hidden" title="Sair da área de administrador" data-icon="logout" aria-label="Sair"></button>
        <nav class="topnav" id="topnav" aria-label="Navegação"></nav>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"></button>
      </div>
    </div>
  </header>

  <main id="main" class="admin-only hidden">
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title"><span data-icon="plus"></span>Cadastrar atendente</div>
          <div class="panel-sub">Cada atendente usa o próprio PIN para pegar e finalizar atendimentos.</div>
        </div>
      </div>
      <div class="form-grid">
        <label class="field"><span>Nome</span><input type="text" id="nome" maxlength="120" placeholder="Ex.: Ana Souza"></label>
        <label class="field"><span>PIN (4 a 6 dígitos)</span><input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="new-password"></label>
        <button id="salvar" class="btn btn-primary" data-icon="check">Cadastrar</button>
      </div>
      <div class="form-err" id="form-err"></div>
    </div>

    <div class="section-head">
      <div class="sec-icon teal" data-icon="users"></div>
      <h2>Equipe</h2>
      <span class="count" id="n-att">0</span>
    </div>
    <div id="lista" class="person-grid"></div>
  </main>

  <script src="/static/ui.js"></script>
  <script src="/static/admin.js"></script>
  <script src="/static/attendants.js"></script>
</body>
</html>
