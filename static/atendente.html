<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#73B63A">
  <title>Tela Atendente · Banho & Tosa</title>
  <link rel="icon" href="/static/logo-256.png">
  <link rel="apple-touch-icon" href="/static/logo-256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="tablet">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img src="/static/logo-256.png" alt="Cão & Cia" class="logo">
        <div class="brand-text">
          <span class="brand-name">Cão &amp; Cia</span>
          <h1 class="page-title">Banho &amp; Tosa</h1>
        </div>
      </a>
      <div class="topbar-actions">
        <span id="sync-status" class="live-pill loading"><span class="live-dot"></span><span>Carregando...</span></span>
        <nav class="topnav" id="topnav" aria-label="Navegação"></nav>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false"></button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-row">
      <div class="stat-card amber">
        <div class="stat-icon" data-icon="bell"></div>
        <div>
          <div class="stat-value" id="c-aguardando">0</div>
          <div class="stat-label">Esperando</div>
        </div>
      </div>
      <div class="stat-card teal">
        <div class="stat-icon" data-icon="scissors"></div>
        <div>
          <div class="stat-value" id="c-em_atendimento">0</div>
          <div class="stat-label">Em banho</div>
        </div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon" data-icon="checkCircle"></div>
        <div>
          <div class="stat-value" id="c-concluido">0</div>
          <div class="stat-label">Prontos hoje</div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button id="btn-next" class="btn btn-primary btn-lg" data-icon="paw">Atender pet</button>
      <button id="btn-finish" class="btn btn-teal btn-lg" data-icon="checkCircle">Encerrar atendimento</button>
    </div>

    <label class="search">
      <span data-icon="search"></span>
      <input type="search" id="search" placeholder="Buscar pet, tutor ou microchip..." autocomplete="off">
    </label>

    <section>
      <div class="section-head">
        <div class="sec-icon amber" data-icon="bell"></div>
        <h2>Esperando</h2>
        <span class="count" id="n-waiting">0</span>
      </div>
      <div id="waiting" class="list"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="sec-icon teal" data-icon="scissors"></div>
        <h2>Em atendimento</h2>
        <span class="count" id="n-doing">0</span>
      </div>
      <div id="doing" class="list"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="sec-icon green" data-icon="checkCircle"></div>
        <h2>Prontos hoje</h2>
        <span class="count" id="n-done">0</span>
      </div>
      <div id="done" class="list-compact"></div>
    </section>
  </main>

  <script src="/static/ui.js"></script>
  <script src="/static/atendente.js"></script>
</body>
</html>
