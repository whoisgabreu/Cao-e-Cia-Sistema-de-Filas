<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila Banho & Tosa - Cão & Cia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/logo-cao-cia.png" alt="Cão & Cia" class="logo">
      <div>
        <h1>Fila Banho &amp; Tosa</h1>
        <div class="sub" id="sync-status">Carregando...</div>
      </div>
    </div>
    <div class="actions">
      <button id="finish-now" class="btn btn-finish-big">Finalizar Atendimento</button>
      <button id="sync-now" class="btn">Sincronizar agora</button>
      <a href="/atendente">Tela Atendente</a>
      <a href="/atendente-minimalista">Tela Atendente v2</a>
      <a href="/attendants">Atendentes</a>
      <a href="/audit">Auditoria</a>
      <a href="/ferramentas">Ferramentas</a>
    </div>
  </header>

  <main>
    <div class="board-search">
      <input type="search" id="board-search" placeholder="Buscar pet pelo nome ou tutor..." autocomplete="off">
      <div id="board-search-note" class="board-search-note" style="display:none;">Nenhum pet encontrado.</div>
    </div>
    <div class="board">
      <section class="column col-aguardando">
        <div class="col-head">Agendados <span class="count">0</span></div>
        <div class="cards"></div>
      </section>
      <section class="column col-presente">
        <div class="col-head">Aguardando atendimento <span class="count">0</span></div>
        <div class="cards"></div>
      </section>
      <section class="column col-em_atendimento">
        <div class="col-head">Em atendimento <span class="count">0</span></div>
        <div class="cards"></div>
      </section>
      <section class="column col-concluido">
        <div class="col-head">Concluídos <span class="count">0</span></div>
        <div class="cards"></div>
      </section>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
